<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minecraft Bingo</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4CAF50; border: none; color: #fff; border-radius: 6px; margin: 5px; }
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        .controls { margin-bottom: 15px; }
        .room-info { background: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .room-info input { padding: 8px; font-size: 14px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; margin: 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 20px; max-width: 600px; }
        .grid-item { 
            background: #2d2d2d; 
            padding: 12px 8px; 
            border-radius: 8px; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            aspect-ratio: 1 / 1; 
            position: relative;
            cursor: pointer;
        }
        .grid-item canvas { 
            display: block; 
            image-rendering: crisp-edges; 
            image-rendering: pixelated;
            width: 64px;
            height: 64px;
        }
        .grid-item .cross {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            object-fit: contain;
            pointer-events: none;
            display: none;
        }
        .grid-item.checked .cross {
            display: block;
        }
        .status { color: #aaa; margin: 10px 0; }
        .players { display: flex; gap: 20px; margin: 10px 0; }
        .player { background: #2d2d2d; padding: 10px; border-radius: 6px; }
        .player.active { border: 2px solid #4CAF50; }
        .player-name { font-weight: bold; }
    </style>
</head>
<body>
    <div class="room-info">
        <div style="margin-bottom: 10px;">
            <b>🎮 Режим бинго: </b>
            <button onclick="createRoom()">Создать комнату</button>
            <span style="margin: 0 10px;">или</span>
            <input type="text" id="roomInput" placeholder="Код комнаты" maxlength="6">
            <button onclick="joinRoom()">Подключиться</button>
        </div>
        <div class="status" id="status">Создайте или присоединитесь к комнате</div>
        <div class="players" id="players"></div>
    </div>
    <div id="gameArea" style="display: none;">
        <button onclick="loadRandomItems()">Новые предметы</button>
        <div class="grid" id="grid"></div>
    </div>

    <script src="blocks-db.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAHt6rF8R2Eexh6AtdEwyp629oFwG7Ookc",
            authDomain: "minecraft-bingo-thel1ne.firebaseapp.com",
            databaseURL: "https://minecraft-bingo-thel1ne-default-rtdb.firebaseio.com",
            projectId: "minecraft-bingo-thel1ne",
            storageBucket: "minecraft-bingo-thel1ne.firebasestorage.app",
            messagingSenderId: "420146154901",
            appId: "1:420146154901:web:83b6f140e52d4893ed7a9c"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const SPRITE_URL = 'sprite.webp';
        const CROSS_URL = 'x.png';
        const ICON_SIZE = 48;
        const ICONS_PER_ROW = 30;
        const TOTAL_ITEMS = Object.keys(blocks_db).length;

        let roomId = null;
        let playerId = null;
        let playerName = null;
        let currentItems = [];

        const spriteImage = new Image();
        spriteImage.src = SPRITE_URL;
        const crossImage = new Image();
        crossImage.src = CROSS_URL;

        function createRoom() {
            roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            playerId = 'player1';
            playerName = 'Игрок 1';
            document.getElementById('status').textContent = `Комната создана! Код: ${roomId}`;
            initGame();
        }

        function joinRoom() {
            roomId = document.getElementById('roomInput').value.toUpperCase().trim();
            if (!roomId) return alert('Введите код комнаты');
            
            database.ref(`rooms/${roomId}/players`).once('value', (snapshot) => {
                const players = snapshot.val();
                if (!players) {
                    alert('Комната не найдена!');
                    return;
                }
                
                const existingPlayers = Object.keys(players);
                if (existingPlayers.includes('player2')) {
                    playerId = 'player' + Math.random().toString(36).substring(2, 6);
                } else {
                    playerId = 'player2';
                }
                playerName = 'Игрок 2';
                document.getElementById('status').textContent = `Подключено к комнате ${roomId}`;
                initGame();
            });
        }

        function initGame() {
            database.ref(`rooms/${roomId}/players/${playerId}`).set({
                name: playerName,
                online: true
            });

            window.addEventListener('beforeunload', () => {
                if (roomId && playerId) {
                    database.ref(`rooms/${roomId}/players/${playerId}`).remove();
                }
            });

            document.getElementById('gameArea').style.display = 'block';
            
            if (playerId === 'player1') {
                loadRandomItems();
            }
            
            database.ref(`rooms/${roomId}`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                
                updatePlayers(data.players);
                
                if (data.currentItems) {
                    currentItems = data.currentItems;
                    renderGrid(data.checkedItems || {});
                }
            });
        }

        function updatePlayers(players) {
            const playersDiv = document.getElementById('players');
            playersDiv.innerHTML = '';
            if (!players) return;
            
            for (const [id, player] of Object.entries(players)) {
                if (!player.online) continue;
                const playerDiv = document.createElement('div');
                playerDiv.className = `player ${id === playerId ? 'active' : ''}`;
                playerDiv.innerHTML = `
                    <div class="player-name">${player.name} ${id === playerId ? '(вы)' : ''}</div>
                `;
                playersDiv.appendChild(playerDiv);
            }
        }

        function getIconPosition(spriteIndex) {
            const row = Math.floor((spriteIndex - 1) / ICONS_PER_ROW);
            const col = (spriteIndex - 1) % ICONS_PER_ROW;
            return { x: col * ICON_SIZE, y: row * ICON_SIZE };
        }

        function renderIcon(spriteIndex, size = 48) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const pos = getIconPosition(spriteIndex);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(spriteImage, pos.x, pos.y, ICON_SIZE, ICON_SIZE, 0, 0, size, size);
            return canvas;
        }

        function getRandomIds(count) {
            const ids = new Set();
            while (ids.size < count) {
                ids.add(Math.floor(Math.random() * TOTAL_ITEMS) + 1);
            }
            return [...ids];
        }

        function loadRandomItems() {
            const ids = getRandomIds(25);
            database.ref(`rooms/${roomId}`).update({
                currentItems: ids,
                checkedItems: {}
            });
        }

        function toggleItem(index) {
            database.ref(`rooms/${roomId}/checkedItems/${index}`).transaction((current) => {
                return current ? null : true;
            });
        }

        function renderGrid(checkedItems) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            if (!currentItems || !currentItems.length) return;
            
            currentItems.forEach((id, index) => {
                const div = document.createElement('div');
                div.className = 'grid-item';
                if (checkedItems[index]) {
                    div.classList.add('checked');
                }
                div.title = blocks_db[id]?.name;
                div.onclick = () => toggleItem(index);
                
                const canvas = renderIcon(id, 64);
                div.appendChild(canvas);
                
                const cross = document.createElement('img');
                cross.className = 'cross';
                cross.src = CROSS_URL;
                cross.alt = 'X';
                div.appendChild(cross);
                
                grid.appendChild(div);
            });
        }

        spriteImage.onload = () => {
            document.getElementById('loadBtn') && (document.getElementById('loadBtn').disabled = false);
        };
    </script>
</body>
</html>
